<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شوخی با رفیق</title>
  <style>
    /* تنظیمات کلی */
    body {
      font-family: Tahoma, sans-serif;
      background-color: #FF0000; /* پس‌زمینه قرمز */
      color: #fff;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* استایل فرم */
    #mainContent {
      background-color: #000;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      width: 90%;
      max-width: 400px;
    }

    /* استایل متن نتیجه */
    #result {
      display: none;
      color: white;
      font-size: 50px;
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
    }

    /* استایل input و button */
    input {
      padding: 10px;
      font-size: 18px;
      width: 100%;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      border-radius: 5px;
      border: none;
      background-color: #000;
      color: #fff;
    }

    button:hover {
      background-color: #555;
    }

    /* مدیا کوئری برای نمایش بهتر در گوشی */
    @media (max-width: 768px) {
      #mainContent {
        width: 90%;
        padding: 15px;
      }

      #result {
        font-size: 40px; /* تنظیم اندازه فونت برای گوشی‌های موبایل */
      }

      input {
        font-size: 16px; /* تغییر اندازه فونت input */
      }

      button {
        font-size: 16px; /* تغییر اندازه دکمه برای گوشی */
      }
    }

    @media (max-width: 480px) {
      #result {
        font-size: 36px; /* سایز کوچکتر در صفحه‌های موبایل */
      }

      input {
        font-size: 14px; /* تغییر سایز فونت برای گوشی‌های کوچک‌تر */
      }

      button {
        font-size: 14px; /* تغییر اندازه دکمه برای گوشی‌های کوچک‌تر */
      }
    }
  </style>
</head>
<body>

  <div id="mainContent">
    <h2>نام ته نوشته فال ته ببینم:</h2>
    <input type="text" id="nameInput" placeholder="نام خودت رو وارد کن">
    <br>
    <button onclick="showMessage()">تأیید</button>
  </div>

  <div id="result"></div>

  <script>
    function showMessage() {
      var name = document.getElementById("nameInput").value.trim();

      // اگر نام خالی بود، به کاربر اطلاع می‌دهیم
      if (name === "") {
        alert("لطفاً اسم رو وارد کن!");
        return;
      }

      // ساخت پیام
      var msg = name + "، بسیار ک\u0648\u0646\u06CC آدم هستی";

      // مخفی کردن فرم و نمایش پیام
      document.getElementById("mainContent").style.display = "none"; // مخفی کردن فرم
      document.getElementById("result").innerHTML = msg; // نمایش پیام
      document.getElementById("result").style.display = "block"; // نمایش نتیجه

      // تنظیمات استایل برای متن بزرگ در وسط صفحه
      document.getElementById("result").style.fontSize = "60px";  // اندازه بزرگ متن
      document.getElementById("result").style.fontWeight = "bold"; // ضخیم شدن متن
      document.getElementById("result").style.color = "white"; // رنگ سفید
    }
  </script>

</body>
</html>
